<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro como Proveedor — Periferia IT Group</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #f0f2f5;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      align-items: center;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      height: 100%;
      background: #fff;
      box-shadow: 0 0 12px rgba(0,0,0,.1);
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a56db;
      color: #fff;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 600; }

    #btn-nueva-sesion {
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 6px;
      background: transparent;
      color: #fff;
      cursor: pointer;
    }
    #btn-nueva-sesion:hover { background: rgba(255,255,255,.15); }

    /* ── Banner confirmación ── */
    #banner-confirmacion {
      display: none;
      padding: 10px 16px;
      background: #fff3cd;
      border-bottom: 2px solid #ffc107;
      font-size: 13px;
      color: #856404;
      flex-shrink: 0;
    }
    #banner-confirmacion.visible { display: block; }

    /* ── Historial ── */
    #historial {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .burbuja {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .burbuja-usuario {
      align-self: flex-end;
      background: #1a56db;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .burbuja-agente {
      align-self: flex-start;
      background: #f1f3f5;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }
    .burbuja-sistema {
      align-self: center;
      font-size: 12px;
      color: #888;
      background: none;
      padding: 4px 0;
    }

    /* ── Pensando ── */
    #pensando {
      align-self: flex-start;
      background: #f1f3f5;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #555;
      font-size: 13px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ccc;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tool calls ── */
    details.bloque-tool {
      align-self: flex-start;
      max-width: 78%;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      overflow: hidden;
      font-size: 12px;
    }
    details.bloque-tool summary {
      padding: 7px 12px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      color: #495057;
      list-style: none;
    }
    details.bloque-tool summary::-webkit-details-marker { display: none; }
    details.bloque-tool summary .chevron { transition: transform .2s; }
    details.bloque-tool[open] summary .chevron { transform: rotate(90deg); }
    .ok-badge { color: #198754; font-weight: 700; }
    .err-badge { color: #dc3545; font-weight: 700; }
    details.bloque-tool pre {
      margin: 0;
      padding: 8px 12px;
      background: #212529;
      color: #adb5bd;
      font-size: 11px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border-top: 1px solid #dee2e6;
    }

    /* ── Footer ── */
    footer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #dee2e6;
      background: #fff;
      flex-shrink: 0;
    }
    #input-mensaje {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color .15s;
    }
    #input-mensaje:focus { border-color: #1a56db; }
    #input-mensaje.confirmacion-pendiente {
      border-color: #ffc107;
      border-width: 2px;
      background: #fffdf0;
    }
    #btn-enviar {
      padding: 8px 18px;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
      align-self: flex-end;
    }
    #btn-enviar:hover:not(:disabled) { background: #1648c8; }
    #btn-enviar:disabled { background: #adb5bd; cursor: not-allowed; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <h1>Registro como Proveedor — Periferia IT Group</h1>
    <button id="btn-nueva-sesion">Nueva sesión</button>
  </header>

  <div id="banner-confirmacion">
    ⚠️ El agente espera tu confirmación explícita.
    Escribe <strong>sí</strong>, <strong>confirmo</strong> o <strong>ok</strong> para proceder, o cualquier otro mensaje para cancelar.
  </div>

  <main id="historial"></main>

  <footer>
    <textarea
      id="input-mensaje"
      placeholder="Escribe tu mensaje… (Enter para enviar, Shift+Enter para nueva línea)"
      rows="2"
    ></textarea>
    <button id="btn-enviar">Enviar</button>
  </footer>

</div>

<script>
'use strict'

const BACKEND_URL = (typeof window !== 'undefined' && window.BACKEND_URL) || 'http://localhost:3000'

let sessionId = crypto.randomUUID()
let enviando = false

const historial = document.getElementById('historial')
const inputMensaje = document.getElementById('input-mensaje')
const btnEnviar = document.getElementById('btn-enviar')
const btnNuevaSesion = document.getElementById('btn-nueva-sesion')
const bannerConfirmacion = document.getElementById('banner-confirmacion')

/* ── Utilidades DOM ── */

function scrollAbajo() {
  historial.scrollTop = historial.scrollHeight
}

function crearBurbuja(clase, texto) {
  const div = document.createElement('div')
  div.className = 'burbuja ' + clase
  div.textContent = texto
  return div
}

/* ── Render mensajes ── */

function renderMensajeUsuario(texto) {
  historial.appendChild(crearBurbuja('burbuja-usuario', texto))
  scrollAbajo()
}

function renderToolCall(tc) {
  const ok = tc.ok === true
  const details = document.createElement('details')
  details.className = 'bloque-tool'

  const summary = document.createElement('summary')
  const chevron = document.createElement('span')
  chevron.className = 'chevron'
  chevron.textContent = '▶'
  const badge = document.createElement('span')
  badge.className = ok ? 'ok-badge' : 'err-badge'
  badge.textContent = ok ? '✓' : '✗'
  summary.appendChild(chevron)
  summary.appendChild(document.createTextNode(' ' + tc.name + ' — '))
  summary.appendChild(badge)
  details.appendChild(summary)

  const pre = document.createElement('pre')
  const argsStr = tc.arguments ? JSON.stringify(tc.arguments, null, 2) : '{}'
  const resumenStr = typeof tc.resumen === 'string'
    ? (tc.resumen.length > 500 ? tc.resumen.slice(0, 500) + '…' : tc.resumen)
    : JSON.stringify(tc.resumen || {})
  pre.textContent = 'args:\n' + argsStr + '\n\nresumen:\n' + resumenStr
  details.appendChild(pre)

  historial.appendChild(details)
}

function renderMensajeAgente(reply, toolCalls) {
  if (Array.isArray(toolCalls) && toolCalls.length > 0) {
    for (const tc of toolCalls) {
      renderToolCall(tc)
    }
  }
  if (reply && reply.trim().length > 0) {
    historial.appendChild(crearBurbuja('burbuja-agente', reply))
  }
  scrollAbajo()
}

function renderMensajeSistema(texto) {
  historial.appendChild(crearBurbuja('burbuja-sistema', texto))
  scrollAbajo()
}

/* ── Pensando ── */

function mostrarPensando() {
  const div = document.createElement('div')
  div.id = 'pensando'
  const spinner = document.createElement('span')
  spinner.className = 'spinner'
  div.appendChild(spinner)
  div.appendChild(document.createTextNode('Pensando…'))
  historial.appendChild(div)
  scrollAbajo()
}

function ocultarPensando() {
  document.getElementById('pensando')?.remove()
}

/* ── Estado confirmación ── */

function setConfirmacionPendiente(estado) {
  if (estado) {
    bannerConfirmacion.classList.add('visible')
    inputMensaje.classList.add('confirmacion-pendiente')
  } else {
    bannerConfirmacion.classList.remove('visible')
    inputMensaje.classList.remove('confirmacion-pendiente')
  }
}

/* ── Enviar mensaje ── */

async function sendMessage() {
  const texto = inputMensaje.value.trim()
  if (!texto || enviando) return

  enviando = true
  btnEnviar.disabled = true
  inputMensaje.value = ''

  renderMensajeUsuario(texto)
  mostrarPensando()

  try {
    const res = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId, message: texto }),
    })
    const data = await res.json()
    ocultarPensando()
    renderMensajeAgente(data.reply || '', data.toolCalls || [])
    setConfirmacionPendiente(data.needsConfirmation === true)
  } catch (err) {
    ocultarPensando()
    renderMensajeAgente('Error de conexión: ' + (err.message || String(err)), [])
    setConfirmacionPendiente(false)
  } finally {
    enviando = false
    btnEnviar.disabled = false
    inputMensaje.focus()
  }
}

/* ── Nueva sesión ── */

function nuevaSesion() {
  sessionId = crypto.randomUUID()
  historial.innerHTML = ''
  setConfirmacionPendiente(false)
  renderMensajeSistema('Nueva sesión iniciada.')
  inputMensaje.focus()
}

/* ── Event listeners ── */

btnEnviar.addEventListener('click', sendMessage)

inputMensaje.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendMessage()
  }
})

btnNuevaSesion.addEventListener('click', nuevaSesion)

/* ── Saludo inicial ── */
renderMensajeSistema('Sesión iniciada. Escribe "procesa el caso <nombre>" para comenzar.')
inputMensaje.focus()
</script>
</body>
</html>
